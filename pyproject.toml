[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diveplan"
version = "0.1.0"
description = "Python library for dive planning and decompression calculation. Extensible deco algorithm core designed for both single dive planning and large-scale simulation."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "furo>=2025.12.19",
    "pydantic>=2.13.4",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.10.2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]

# Deco models are discovered from the "diveplan.deco_models" entry-point group
# (see src/diveplan/registry.py). The registry eagerly loads every entry point
# in the group, so an entry must only be registered once its module exists —
# a dangling reference would break all model lookups.
#
[project.entry-points."diveplan.deco_models"]
zhl16c = "diveplan.models.buhlmann.zhl16:ZHL16C"
vpmb = "diveplan.models.vpm.model:VpmB"

[project.entry-points."diveplan.formatters"]
console = "diveplan.dive.formatters.console:ConsoleFormatter"
json = "diveplan.dive.formatters.json:JsonFormatter"
subsurface = "diveplan.dive.formatters.subsurface:SubsurfaceXmlFormatter"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.mypy]
strict = true
python_version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]
